name: Auto build & release tankxu FreeTube IPA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freetube-tankxu-autorelease
  cancel-in-progress: false

env:
  PATCH_REVISION: ios27fix2

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.upstream.outputs.should_build }}

    steps:
      - name: Get latest tankxu branch commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHA="$(git ls-remote https://github.com/tankxu/freetube.git refs/heads/tankxu | awk '{print $1}')"

          if [ -z "$SHA" ]; then
            echo "::error::Unable to resolve tankxu/freetube branch tankxu"
            exit 1
          fi

          SHORT_SHA="${SHA:0:8}"
          TAG="freetube-tankxu-${SHORT_SHA}-${PATCH_REVISION}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New patched build required for: $SHA"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact upstream commit
        uses: actions/checkout@v4
        with:
          repository: tankxu/freetube
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1
          path: source

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        working-directory: source
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/DerivedData"
          xcodebuild \
            -resolvePackageDependencies \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            | tee "$GITHUB_WORKSPACE/package-resolution.log"

      - name: Apply iOS 27 LNPopupController NaN guard
        run: |
          set -euo pipefail

          CHECKOUTS="$GITHUB_WORKSPACE/DerivedData/SourcePackages/checkouts"
          PATCH_FILE="$(find "$CHECKOUTS" -type f -name 'LNPopupController.mm' | head -n 1)"

          if [ -z "$PATCH_FILE" ] || [ ! -f "$PATCH_FILE" ]; then
            echo "::error::LNPopupController.mm was not found"
            find "$CHECKOUTS" -maxdepth 5 -type f -iname '*LNPopupController*' -print || true
            exit 1
          fi

          echo "Patching: $PATCH_FILE"

          # SwiftPM checkouts can be read-only on GitHub's macOS runner.
          # Remove an immutable flag if present and make the checkout writable before patching.
          chflags nouchg "$PATCH_FILE" 2>/dev/null || true
          chmod u+w "$PATCH_FILE"
          ls -l "$PATCH_FILE"

          export PATCH_FILE
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PATCH_FILE"])
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'- \(CGFloat\)_percentFromPopupBar\s*'
              r'\{\s*'
              r'return 1 - \(CGRectGetMaxY\(self\.popupBar\.frame\) / '
              r'\(_cachedDefaultFrame\.origin\.y - _cachedInsets\.bottom\)\);\s*'
              r'\}',
              re.MULTILINE,
          )

          replacement = '''- (CGFloat)_percentFromPopupBar
          {
          \tCGFloat denominator = _cachedDefaultFrame.origin.y - _cachedInsets.bottom;
          \tif(!isfinite(denominator) || (denominator > -0.0001 && denominator < 0.0001))
          \t{
          \t\treturn 0.0;
          \t}

          \tCGFloat maxY = CGRectGetMaxY(self.popupBar.frame);
          \tif(!isfinite(maxY))
          \t{
          \t\treturn 0.0;
          \t}

          \tCGFloat percent = 1.0 - (maxY / denominator);
          \treturn isfinite(percent) ? percent : 0.0;
          }'''

          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not locate the expected _percentFromPopupBar implementation; refusing to build an unpatched IPA")

          path.write_text(patched, encoding="utf-8")
          print("Applied iOS 27 NaN/divide-by-zero guard successfully")
          PY

          grep -n -A18 -- '- (CGFloat)_percentFromPopupBar' "$PATCH_FILE" | head -n 24

      - name: Build unsigned Release app
        working-directory: source
        run: |
          set -o pipefail

          xcodebuild \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        env:
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          set -euo pipefail

          APP="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/FreeTube.app"
          if [ ! -d "$APP" ]; then
            echo "::error::FreeTube.app not found"
            find "$GITHUB_WORKSPACE/DerivedData" -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/Payload/FreeTube.app"

          cd "$GITHUB_WORKSPACE"
          IPA="FreeTube-tankxu-${SHORT_SHA}-${PATCH_REVISION}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "${IPA}.sha256"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"

          ls -lh "$IPA" "${IPA}.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-tankxu-${{ needs.check.outputs.short_sha }}-${{ env.PATCH_REVISION }}-unsigned-IPA
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Automated unsigned IPA build from tankxu/freetube.

          - Branch: tankxu
          - Commit: ${SHA}
          - Configuration: Release / iphoneos
          - Minimum iOS: 17.0+
          - Patch: ${PATCH_REVISION}
          - iOS 27 compatibility: guards LNPopupController popup geometry against NaN/divide-by-zero during presentation

          This IPA is unsigned. Sign it with your own signing method before installing on a normal iPhone/iPad.
          EOF

          gh release create "$TAG" \
            "$IPA_NAME" \
            "${IPA_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FreeTube tankxu ${SHORT_SHA} ${PATCH_REVISION}" \
            --notes-file release-notes.md

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-tankxu-${{ needs.check.outputs.short_sha }}-${{ env.PATCH_REVISION }}-build-logs
          path: |
            xcodebuild.log
            package-resolution.log
          if-no-files-found: ignore
          retention-days: 7
