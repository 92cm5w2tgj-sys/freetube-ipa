name: Auto build & release tankxu FreeTube IPA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: freetube-tankxu-autorelease
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.upstream.outputs.should_build }}

    steps:
      - name: Get latest tankxu branch commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHA="$(git ls-remote https://github.com/tankxu/freetube.git refs/heads/tankxu | awk '{print $1}')"

          if [ -z "$SHA" ]; then
            echo "::error::Unable to resolve tankxu/freetube branch tankxu"
            exit 1
          fi

          SHORT_SHA="${SHA:0:8}"
          TAG="freetube-tankxu-${SHORT_SHA}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commit detected: $SHA"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact upstream commit
        uses: actions/checkout@v4
        with:
          repository: tankxu/freetube
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 1
          path: source

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        working-directory: source
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            | tee "$GITHUB_WORKSPACE/package-resolution.log"

      - name: Build unsigned Release app
        working-directory: source
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/DerivedData"

          xcodebuild \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        env:
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          set -euo pipefail

          APP="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/FreeTube.app"
          if [ ! -d "$APP" ]; then
            echo "::error::FreeTube.app not found"
            find "$GITHUB_WORKSPACE/DerivedData" -type d -name '*.app' -print || true
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/Payload/FreeTube.app"

          cd "$GITHUB_WORKSPACE"
          IPA="FreeTube-tankxu-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "${IPA}.sha256"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"

          ls -lh "$IPA" "${IPA}.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-tankxu-${{ needs.check.outputs.short_sha }}-unsigned-IPA
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Automated unsigned IPA build from tankxu/freetube.

          - Branch: tankxu
          - Commit: ${SHA}
          - Configuration: Release
          - SDK: iphoneos
          - Minimum iOS: 17.0+

          This IPA is unsigned. Sign it with your own signing method before installing on a normal iPhone/iPad.
          EOF

          gh release create "$TAG" \
            "$IPA_NAME" \
            "${IPA_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FreeTube tankxu ${SHORT_SHA}" \
            --notes-file release-notes.md

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-tankxu-${{ needs.check.outputs.short_sha }}-build-logs
          path: |
            xcodebuild.log
            package-resolution.log
          if-no-files-found: ignore
          retention-days: 7
